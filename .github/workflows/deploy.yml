name: Deploy GoClaw to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '147.93.159.110' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/goclaw
            echo "Pulling latest changes from git..."
            rm -f .git/refs/remotes/origin/main.lock .git/index.lock || true
            git fetch origin main || (sleep 2 && git fetch origin main)
            git reset --hard origin/main
            git clean -fd || true
            echo "Updating and restarting containers..."
            docker compose -f docker-compose.yml -f docker-compose.postgres.yml pull
            docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
            echo "Applying executive agent configuration to PostgreSQL..."
            chmod +x scripts/activate_executive_setup.sh || true
            bash scripts/activate_executive_setup.sh || echo "Warning executing setup script, continuing..."
            docker compose -f docker-compose.yml -f docker-compose.postgres.yml restart goclaw || true
            echo "Deployment finished successfully."
