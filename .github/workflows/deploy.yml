name: Deploy GoClaw to VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/diagnose.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '147.93.159.110' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/goclaw
            echo "Pulling latest changes from git..."
            rm -f .git/refs/remotes/origin/main.lock .git/index.lock || true
            git fetch origin main || (sleep 2 && git fetch origin main)
            git reset --hard origin/main
            git clean -fd || true
            echo "Inspecting last 100 lines of goclaw logs before update..."
            docker compose -f docker-compose.yml -f docker-compose.postgres.yml logs --tail 100 goclaw || true
            echo "Updating and building goclaw container from source..."
            docker compose -f docker-compose.yml -f docker-compose.postgres.yml build goclaw
            docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d --force-recreate goclaw
            echo "Applying executive agent configuration to PostgreSQL..."
            chmod +x scripts/activate_executive_setup.sh || true
            bash scripts/activate_executive_setup.sh || echo "Warning executing setup script, continuing..."
            echo "Deployment finished successfully."
