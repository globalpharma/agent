name: Deploy GoClaw to VPS

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '147.93.159.110' }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/goclaw
            echo "Pulling latest changes from git..."
            git pull origin main || git pull origin dev || echo "Git pull warning, continuing..."
            echo "Updating and restarting containers..."
            docker compose -f docker-compose.yml -f docker-compose.postgres.yml pull
            docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
            echo "Deployment finished successfully."
